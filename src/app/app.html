<div class="container">
  <div class="row">
    <div class="col-12">
      <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
          <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
          <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
          <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner" style="width: 100%; height: 500px">
          <div class="carousel-item active">
            <img
              src="{{ profile }}"
              style="width: 100%; object-fit: cover"
              class="d-block w-100"
              alt="..."
            />
          </div>
          <div class="carousel-item">
            <img src="{{ profile2 }}" style="object-fit: cover" class="d-block w-100" alt="..." />
          </div>
          <div class="carousel-item">
            <img src="{{ profile }}" style="object-fit: cover" class="d-block w-100" alt="..." />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-target="#carouselExampleIndicators"
          data-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-target="#carouselExampleIndicators"
          data-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </button>
      </div>
    </div>
  </div>
  <hr />
  <h3
    style="text-decoration: underline"
    [style]="{ color: txt_color, 'font-size': txt_size + 'px' }"
    ]
  >
    SETEC
  </h3>
  <h2 [style]="{ color: t_yellow }">hello bro</h2>
  <input type="button" value="click me" (click)="alert()" />
  <input type="button" class="btn btn-danger" value="Change Color" (click)="ChangeColor()" /> &nbsp;
  <input type="button" class="btn btn-info" value="increaseFontSize" (click)="IncreaseFontSize()" />
  &nbsp;
  <input type="button" class="btn btn-info" value="decreaseFontSize" (click)="DecreaseFontSize()" />
  <hr />
  <!-- <ul>
    @for (item of p; track item) {
      <li>{{ item }}</li>
    }
  </ul> -->
</div>
<div class="container">
  <div class="row">
    @for (item of productImage; track item) {
      <div class="col-md-3">
        <div class="card" style="width: 100%">
          <img src="{{ item }}" class="card-img-top" alt="..." />
          <div class="card-body">
            <h5 class="card-title">Card title</h5>
            <p class="card-text">
              Some quick example text to build on the card title and make up the bulk of the card's
              content.
            </p>
            <a href="#" class="btn btn-primary">Go somewhere</a>
          </div>
        </div>
      </div>
    }
  </div>
</div>
